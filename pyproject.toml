[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dhcp-oru-toolkit"
version = "2.1.2"
description = "Zero-dependency DHCP lease viewer and pcap/DHCP forensics for the Fujitsu O-RU shared-xid defect"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "labuser" }]
keywords = ["dhcp", "o-ran", "oru", "pcap", "forensics", "isc-dhcp", "kea"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
dhcp-lease-list = "dhcp_toolkit.leases.cli:main"
dhcp-forensics = "dhcp_toolkit.forensics.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
