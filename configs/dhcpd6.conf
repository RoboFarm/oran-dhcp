    #match if substring(option dhcp6.vendor-class, 6, 18) = "o-ran-ru2/FJ/44R26";
    match if substring(option dhcp6.vendor-class, 6, 40) = "o-ran-ru2/FJ/44R26-N25N66-DC/A2256600222";
