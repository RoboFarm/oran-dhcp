    max-lease-time 150;
    preferred-lifetime 140;
    option dhcp-renewal-time 60;
    option dhcp-rebinding-time 120;
    #SSL-----------------------
    #option dhcp6.vendor-opts 53148 00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC;
    # Controller IPv6 fd00:8b36:f2a9::24:dc
    #TLS-----------------------
    option dhcp6.vendor-opts 53148 00:01:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:95:02:40
    :00:03:00:02:1f:9f
    :00:04:00:06:2F:70:6B:69:78:2F
    :00:05:00:2F:2F:4F:55:3D:53:50:4D:2F:4F:3D:31:46:69:6E:69:74:79:2F:43:3D:55:53:2F:43:4E:3D:41:54:54:2D:53:53:4C:2F:4C:3D:57:56:2F:53:54:3D:54:65:78:61:73
    :00:06:00:04:68:74:74:70
    :00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC
    :00:86:00:01:01;
    # CA server IPv6 fd00:8b36:f2a9::95:240
    # port 8095
    # /pkix/
    # /OU=SPM/O=1Finity/C=US/CN=ATT-SSL/L=WV/ST=Texas
    # http
    # Controller IPv6 fd00:8b36:f2a9::24:dc
    # 01 NETCONF over TLS
}

class "ATTn25n66-AC" {
    #match if substring(option dhcp6.vendor-class, 6, 18) = "o-ran-ru2/FJ/44R26";
    match if substring(option dhcp6.vendor-class, 6, 40) = "o-ran-ru2/FJ/44R26-N25N66-DC/A2256600363";
    log (info, "Matched ATTn25n66-AC class");
    max-lease-time 150;
    preferred-lifetime 140;
    option dhcp-renewal-time 60;
    option dhcp-rebinding-time 120;
    #SSL-----------------------
    #option dhcp6.vendor-opts 53148 00:82:00:0C:6D:70:6C:61:6E:65:2E:6C:6F:63:61:6C;
    # Controller IPv6 fd00:8b36:f2a9::24:dc
    #TLS-----------------------
    option dhcp6.vendor-opts 53148 00:01:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:95:02:40
    :00:03:00:02:1f:a1
    :00:04:00:06:2F:70:6B:69:78:2F
    :00:05:00:2F:2F:4F:55:3D:53:50:4D:2F:4F:3D:31:46:69:6E:69:74:79:2F:43:3D:55:53:2F:43:4E:3D:41:54:54:2D:53:53:4C:2F:4C:3D:57:56:2F:53:54:3D:54:65:78:61:73
    :00:06:00:04:68:74:74:70
    :00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC
    :00:86:00:01:01;
    #TLS E-185 TEST-----------------------
    #option dhcp6.vendor-opts 53148 00:03:00:02:1f:a1
    #:00:04:00:06:2F:70:6B:69:78:2F
    #:00:05:00:2F:2F:4F:55:3D:53:50:4D:2F:4F:3D:31:46:69:6E:69:74:79:2F:43:3D:55:53:2F:43:4E:3D:41:54:54:2D:53:53:4C:2F:4C:3D:57:56:2F:53:54:3D:54:65:78:61:73
    #:00:06:00:04:68:74:74:70
    #:00:82:00:0C:6D:70:6C:61:6E:65:2E:6C:6F:63:61:6C
    #:00:86:00:01:01;
    # CA server IPv6 fd00:8b36:f2a9::95:240
    # port 8097
    # /pkix/
    # /OU=SPM/O=1Finity/C=US/CN=ATT-SSL/L=WV/ST=Texas
    # http
    # Controller IPv6 fd00:8b36:f2a9::24:dc
    # 01 NETCONF over TLS
}


class "Unmatched" { 
    match if substring(option dhcp6.vendor-class, 0, 0) = ""; 
    log (info, "Matched Unmatched class"); 
    log (info, concat("Unmatched Vendor Class String: ", substring(option dhcp6.vendor-class, 6, 33)));
    option dhcp6.vendor-opts 53148 00:81:00:10:FD:00:8B:36:F2:A9:00:00:00:00:00:00:00:24:00:DC; # Controller IPv6 fd00:8b36:f2a9::24:dc + TLS }
}

# IPv6 subnet configuration
subnet6 fd00:8b36:f2a9::/64 {
    # DNS server
    option dhcp6.name-servers fd00:8b36:f2a9::24:14;

    # Pool for Gen1DB
    pool6 {
        allow members of "Gen1DB";
        range6 fd00:8b36:f2a9::100 fd00:8b36:f2a9::109;
    }

    # Pool for Gen1TB
    pool6 {
        allow members of "Gen1TB";
        range6 fd00:8b36:f2a9::110 fd00:8b36:f2a9::119;
    }

    # Pool for Gen2DB
    pool6 {
        allow members of "Gen2DB";
        range6 fd00:8b36:f2a9::120 fd00:8b36:f2a9::129;
    }

    # Pool for Gen2TB
    pool6 {
        allow members of "Gen2TB";
        range6 fd00:8b36:f2a9::130 fd00:8b36:f2a9::139;
    }

    # Pool for TB2
    pool6 {
        allow members of "TB2";
        range6 fd00:8b36:f2a9::140 fd00:8b36:f2a9::149;
    }

    # Pool for n77
    pool6 {
        allow members of "n77";
        range6 fd00:8b36:f2a9::150 fd00:8b36:f2a9::159;
    }

    # Pool for ATTn77
    pool6 {
        allow members of "ATTn77";
        range6 fd00:8b36:f2a9::160 fd00:8b36:f2a9::169;
    }

    # Pool for ATTn25n66
    pool6 {
        allow members of "ATTn25n66-DC";
        allow members of "ATTn25n66-AC";
        range6 fd00:8b36:f2a9::170 fd00:8b36:f2a9::179;
    }


    # Fallback pool for DT radio clients
    pool6 {
        allow members of "DTTB3";
        range6 fd00:8b36:f2a9::180 fd00:8b36:f2a9::199;
    }
    
    # Fallback pool for unmatched clients
    pool6 {
        allow members of "Unmatched";
        range6 fd00:8b36:f2a9::200 fd00:8b36:f2a9::209;
    }
}
